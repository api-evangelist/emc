    url: https://www.dell.com/support/home/en-us
  x-base-url-note: 'Templated, not a placeholder. ECS is a customer-installed appliance: the ECS Management
    REST API is served on port 4443 by the customer''s own ECS or ObjectScale cluster, so there is no
    EMC-operated host. The previous value (https://ecs.example.com:4443) was an RFC 2606 documentation
    placeholder and scored as non-routable; the templated form names the real port and says a customer-supplied
    host is required. Port confirmed from EMC''s own client, github.com/EMCECS/python-ecsclient.'
- aid: emc:unisphere-api
  name: EMC Unisphere REST API
  description: The Unisphere Management REST API provides programmatic access to manage Dell EMC Unity
    and PowerStore storage arrays. It supports storage resource provisioning, performance monitoring,
    alert management, and system configuration operations.
  humanURL: https://developer.dell.com/apis
  baseURL: https://{unisphere_host}:8443/univmax/restapi
