gaps:
- ECS does not publish RFC 9457 application/problem+json. Agents must parse the vendor envelope.
- The registry ships remediation for none of the codes — titles only. No `action` field is asserted here
  because EMC publishes none, and inventing remediation would be fabrication.
- The `retryable` boolean is the only machine-readable retry signal; it is per-response, not per-code,
  so a static code-to-retry mapping cannot be derived from this registry.
