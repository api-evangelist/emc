api: EMC ECS Management REST API
format: vendor-json
description: 'Error catalog for the EMC ECS Management REST API, harvested verbatim from the error-code
  registry shipped inside python-ecsclient — EMC''s own first-party Python client, published from the
  EMCECS GitHub organization. These are the numeric codes ECS returns in the `code` field of its JSON
  error envelope, with the titles EMC ships for them. Not RFC 9457: ECS predates problem+json and uses
  its own envelope.'
envelope:
  media_type: application/json
  shape:
    code: integer — the ECS error code, keyed in codes[] below
    retryable: boolean — whether the caller may retry the same request
    description: string — short description of the failure
    details: string — longer detail, when ECS supplies one
  source: https://github.com/EMCECS/python-ecsclient/blob/master/ecsclient/common/exceptions.py
  note: ECSClientException.from_response() parses exactly these four keys off the response body and falls
    back to the code registry when `details` and `description` are both empty. That fallback is why the
    registry exists in the client at all — ECS does not always return prose.
http_status_mapping:
- status: 401
  meaning: Invalid credentials or expired X-SDS-AUTH-TOKEN
  ecs_codes:
  - '4000'
  note: The client treats 401/403/415 on a token-validation call as "token stale, fetch a new one".
- status: 403
  meaning: Operation forbidden for these credentials, or license check failure
  ecs_codes:
  - '3000'
  - '3001'
- status: 415
  meaning: Unsupported or missing media type
  ecs_codes:
  - '1003'
- status: 500
  meaning: Server-side failure; the client raises rather than retrying
  ecs_codes:
  - '7000'
  - '7001'
code_count: 176
families:
- range: 127–1049
  name: request-validation
  description: Malformed, missing, out-of-range or conflicting request parameters, bodies and headers;
    resource-state conflicts such as already-exists and marked-for-deletion.
- range: 2000–2001
  name: entity-resolution
  description: The entity named in the request URL cannot be found or is inactive and marked for deletion.
- range: 3000–3001
  name: authorization
  description: The operation is forbidden for the supplied credentials, or blocked by a license check.
- range: 4000+
  name: authentication
  description: Invalid credentials or invalid/expired authentication token.
- range: 5001+
  name: controller
  description: Failures raised inside the ECS controller during file and storage-device operations.
- range: 6000+
  name: service-availability
  description: The service is unavailable or an asynchronous operation is still initializing; these are
    the retryable class.
- range: 7000+
  name: api-service
  description: Failures inside the ECS API service itself, including serialization errors.
