brand_lifecycle:
  finding: >-
    The EMC brand itself is mid-transition. EMC was acquired by Dell Technologies in 2016;
    the storage line is now marketed as Dell PowerStore/PowerScale/PowerMax/PowerFlex, and
    ECS — the platform behind the ECS Management REST API — has a named successor in
    ObjectScale, whose 4.0.0.0 build shipped in March 2025 and which has its own Terraform
    provider (dell/objectscale 1.1.0, published 2026-06-24). An integrator choosing a
    target today should know the ECS Management API is on the trailing side of that
    transition.
gaps:
  - No API-level deprecation policy, Sunset header, or breaking-change notice channel.
  - No status page (and none would be meaningful for a customer-hosted appliance).
  - >-
    Product end-of-life dates are published per array on Dell's support site, which
    returns 403 to non-browser clients, so they were not machine-readable from this run.
