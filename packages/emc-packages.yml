description: >-
  First-party client libraries, SDKs and infrastructure-as-code providers published by
  EMC (now Dell EMC / Dell Technologies) for the EMC storage platforms — ECS/ObjectScale
  object storage, Unity, PowerMax (Unisphere for VMAX lineage), PowerScale (Isilon),
  PowerFlex (ScaleIO) and PowerStore. Every entry below was resolved against its
  registry metadata endpoint; version and published date are the values the registry
  returned, not values read from prose.
ownership_note: >-
  EMC was acquired by Dell Technologies in 2016 and the engineering organization now
  publishes under github.com/dell alongside the legacy github.com/EMCECS org. Both orgs
  are treated here as EMC-controlled: EMCECS is the original EMC Elastic Cloud Storage
  org, and the com.emc.ecs Maven group ID is EMC's own reverse-domain namespace.
