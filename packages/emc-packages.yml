currency_finding: >-
  The split is sharp and worth stating plainly. The platforms Dell continues to invest in
  — PowerStore, PowerScale, PowerMax, PowerFlex, ObjectScale — carry SDKs and Terraform
  providers released within the last three months. The EMC-branded ECS Management API
  bindings do not: the Python client last shipped in 2022, the Java management client in
  2019 at version 0.1.0. A consumer integrating against the ECS Management REST API today
  is working with first-party bindings that predate the current platform release.
