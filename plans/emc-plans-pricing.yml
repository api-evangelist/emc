description: >-
  Plans and pricing for the EMC management APIs. There are none, and this file records
  that as a measurement. NOTE: this artifact previously contained scaffold plans — an
  invented emc-free / emc-pro tier ladder with 1,000-request monthly quotas — written by
  the 2026-05-04 bulk sweep and never sourced from EMC. Those have been removed.
plan_count: 0
plans: []
finding: >-
  There is no API pricing because the API is not the product. The ECS Management REST API
  and the Unisphere REST API ship with the array — a customer who has bought ECS,
  ObjectScale, Unity or PowerMax has unmetered access to the management API of their own
  hardware, and a customer who has not cannot call it at any price. Commercial terms are
  negotiated per array through Dell sales and Dell ProSupport entitlements, not published
  as developer plans.
free_access_path: >-
  The one genuinely free way to reach this API is ECS Community Edition, EMC's own free
  self-deployable build of the platform (see sandbox/emc-sandbox.yml). It is free of
  charge and carries no API quota, because it runs on the developer's own hardware.
enterprise_only: true
contact_sales: https://www.dell.com/en-us/dt/contact-us.htm
