description: >-
  Rate limits for the EMC management APIs. There are none published, and this file records
  that as a measurement rather than omitting itself. NOTE: this artifact previously
  contained scaffold values — invented free/professional tiers with 10 and 100
  requests-per-minute quotas — written by the 2026-05-04 bulk sweep. Those were never
  EMC's numbers and have been removed.
