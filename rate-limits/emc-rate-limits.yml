finding: >-
  The EMC ECS Management REST API and the Unisphere REST API are appliance APIs served by
  hardware the customer owns and operates. There is no EMC-operated gateway between the
  caller and the array, no per-key quota, and no metered plan — so there is nothing for
  EMC to rate-limit and nothing to publish. Throughput is bounded by the customer's own
  cluster. EMC's own client libraries carry no RateLimit-*, X-RateLimit-* or Retry-After
  handling of any kind, and no 429 appears anywhere in the 176-code ECS error registry
  (see errors/emc-error-codes.yml), which is strong corroboration that the API does not
  emit one.
agent_impact: >-
  An agent gets no runtime backpressure signal from these APIs. The only availability
  signal published is ECS error code 6000, "Unable to connect to the service. The service
  is unavailable, try again later", together with the per-response `retryable` boolean in
  the error envelope. Those are the retry primitives; there is no reset time to wait for.
