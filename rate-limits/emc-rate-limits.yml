source: >-
  Searched the reachable EMC/Dell developer surface and read EMC's own first-party clients
  (github.com/EMCECS/python-ecsclient, github.com/dell/PyU4V) on 2026-08-29 for
  rate-limit handling. Neither client sets, reads, or retries on any rate-limit header.
