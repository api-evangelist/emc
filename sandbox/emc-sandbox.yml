description: >-
  EMC does not run a hosted API sandbox with test keys the way a SaaS provider does — the
  product is an appliance. What it publishes instead is a free, self-deployable full build
  of the platform: ECS Community Edition, which installs a real ECS cluster (management
  API included) on commodity hardware or VMs. For an integrator wanting to develop against
  the ECS Management REST API without buying an array, this is the sandbox.
