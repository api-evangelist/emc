llms_txt_finding: >-
  https://www.dell.com/llms.txt returns HTTP 200 text/plain and is a real, substantial
  llms.txt — but it is a Dell Technologies retail commerce index (laptops, desktops,
  monitors, gaming PCs). It contains nothing about the EMC storage APIs, ECS, Unisphere
  or developer.dell.com, so it is recorded here as a finding and is NOT wired as this
  provider's LLMsTxt pointer. See llms/emc-llms.txt for the generated EMC-scoped file.
