description: >-
  /.well-known/ discovery surface for the hosts EMC (Dell EMC) serves its corporate and
  developer properties from. One real document was found: an RFC 9116 security.txt at
  www.dell.com. Every other path either 404s or 302s into the marketing site — including
  /.well-known/api-catalog, which redirects to the Dell homepage rather than serving an
  RFC 9727 catalog.
